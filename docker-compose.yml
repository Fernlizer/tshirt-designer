services:
  backend:
    build: ./backend
    container_name: tshirt-backend
    ports:
      - "9004:9004"
    volumes:
      - ./backend:/app
      - backend-uploads:/app/uploads
      - backend-mockups:/app/mockups
      - backend-data:/app/data
    environment:
      - TSHIRT_DEBUG=${TSHIRT_DEBUG:-true}
      - TSHIRT_CORS_ORIGINS=["http://localhost:9005","http://localhost:3000"]
      - TSHIRT_REQUIRE_TURNSTILE=${TSHIRT_REQUIRE_TURNSTILE:-false}
      - TSHIRT_TURNSTILE_SITE_KEY=${TSHIRT_TURNSTILE_SITE_KEY:-}
      - TSHIRT_TURNSTILE_SECRET=${TSHIRT_TURNSTILE_SECRET:-}
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: tshirt-frontend
    ports:
      - "9005:9005"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_API_PROXY_TARGET=http://backend:9004
    restart: unless-stopped

volumes:
  backend-uploads:
  backend-mockups:
  backend-data:
